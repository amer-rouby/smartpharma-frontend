<mat-toolbar color="primary" class="header-toolbar">

  <div class="header-right">
    <button mat-icon-button (click)="toggleSidebar.emit()" class="toggle-sidebar-btn"
      [matTooltip]="'HEADER.MENU' | translate">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="logo-section" routerLink="/dashboard" [matTooltip]="'HEADER.BACK_TO_HOME' | translate">
      <div class="logo-icon">
        <img src="assets/logo.svg" alt="" class="logo-img">
      </div>
      <div class="logo-text-container">
        <span class="logo-text">{{pharmacyDisplayName() || ('APP.NAME' | translate)}}</span>
        <span class="logo-subtitle">{{'APP.SUBTITLE' | translate}}</span>
      </div>
    </div>
  </div>

  <div class="header-left">

    <button mat-icon-button (click)="toggleTheme()" class="theme-toggle-btn"
      [matTooltip]="(isDarkTheme() ? 'HEADER.LIGHT_MODE' : 'HEADER.DARK_MODE') | translate">
      <mat-icon>{{isDarkTheme() ? 'light_mode' : 'dark_mode'}}</mat-icon>
    </button>

    <button mat-icon-button (click)="toggleLanguage()" class="language-toggle-btn"
      [matTooltip]="(currentLang() === 'ar' ? 'HEADER.SWITCH_TO_ENGLISH' : 'HEADER.SWITCH_TO_ARABIC') | translate">
      <span class="lang-code">{{currentLang() === 'ar' ? 'EN' : 'ع'}}</span>
    </button>

    <app-notification-panel [notifications]="notifications()" [unreadCount]="unreadCount()"
      (onRefreshRequired)="loadNotifications()" (markAllRead)="onMarkAllAsRead()"
      (notificationClick)="onNotificationClick($event)" (viewAll)="onViewAllNotifications()">
    </app-notification-panel>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-btn"
      [matTooltip]="'HEADER.PROFILE' | translate">
      <div class="user-info-mini">
        <div class="user-avatar">
          @if (profileImageUrl(); as imageUrl) {
          <img [src]="imageUrl" alt="" class="user-avatar-img">
          } @else {
          <mat-icon>account_circle</mat-icon>
          }
        </div>
        <div class="user-details">
          <span class="user-name">{{userDisplayName()}}</span>
          <span class="user-role">{{userDisplayRole()}}</span>
        </div>
        <mat-icon class="dropdown-arrow">expand_more</mat-icon>
      </div>
    </button>

    <mat-menu #userMenu="matMenu" class="user-menu user-menu-wide" xPosition="before" yPosition="below">
      <div class="user-menu-header">
        <div class="user-avatar-large">
          @if (profileImageUrl(); as imageUrl) {
          <img [src]="imageUrl" alt="" class="user-avatar-large-img">
          } @else {
          <mat-icon>account_circle</mat-icon>
          }
        </div>
        <div class="user-menu-info">
          <p class="user-menu-name">
            <span>{{userDisplayName()}}</span>
          </p>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item routerLink="/settings/profile">
        <mat-icon>person_outline</mat-icon>
        <span>{{'HEADER.PROFILE' | translate}}</span>
      </button>

      @if (hasAccess(['ADMIN', 'MANAGER'])) {
      <button mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>{{'NAV.SETTINGS' | translate}}</span>
      </button>
      }

      <button mat-menu-item routerLink="/help">
        <mat-icon>help_outline</mat-icon>
        <span>{{'HEADER.HELP' | translate}}</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()" class="logout-item">
        <mat-icon>exit_to_app</mat-icon>
        <span>{{'HEADER.LOGOUT' | translate}}</span>
      </button>
    </mat-menu>

  </div>
</mat-toolbar>
